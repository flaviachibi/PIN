<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore os Biomas - Desktop</title>
    <link rel="stylesheet" href="biomas.css">
</head>
<body id="topo">
    <a href="#topo" class="btn-topo" title="Voltar ao topo">&#8593</a>

    <!-- 1. ADICIONADO: Checkbox e Overlay para o Menu Lateral funcionar no redimensionamento -->
    <input type="checkbox" id="drawer-toggle" class="menu-checkbox">
    <label for="drawer-toggle" class="overlay" aria-label="Fechar menu"></label>

    <!-- 2. ADICIONADO: Menu Lateral (Drawer) oculto no PC, aparece no mobile -->
    <aside class="drawer">
        <div class="drawer-header">
            <div class="drawer-avatar"><img src="Img/LOGOdentroMenu.png.png" alt="logo biomas" width="80"></div>
            <label for="drawer-toggle" class="drawer-close-btn" aria-label="Fechar menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </label>
        </div>
        <nav class="drawer-nav">
            <a href="4desktop.html" class="nav-link">Início</a>
            <a href="biomadesktop.html" class="nav-link">Biomas</a>
            <a href="ProblemasDesktop.html" class="nav-link">Problemas</a>
            <a href="PreservacaoDesk.html" class="nav-link">Preservação</a>
            <a href="SobreDesk.html" class="nav-link">Sobre</a>
        </nav>
    </aside>

    <div class="desktop-container">

        <!-- Cabeçalho Atualizado com o Botão Hambúrguer -->
        <header class="desktop-header">
            <!-- Botão Hambúrguer (Fica escondido no PC, aparece quando a tela diminui) -->
            <label for="drawer-toggle" class="hamburger-btn" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

           <a href="4desktop.html">
    <img src="Img/logo-superior.png.png" alt="Biomas do Brasil Logo" class="desktop-logo">
</a>

            <nav class="desktop-nav">
                <a href="4desktop.html" class="nav-link">Início</a>
                <a href="biomadesktop.html" class="nav-link">Biomas</a>
                <a href="ProblemasDesktop.html" class="nav-link active">Problemas</a>
                <a href="PreservacaoDesk.html" class="nav-link">Preservação</a>
                <a href="SobreDesk.html" class="nav-link">Sobre</a>
            </nav>
        </header>
        <!-- Seção Principal (Explore os Biomas) -->
        <main class="explore-desktop-section">
            <h1 class="explore-desktop-title">Explore os biomas brasileiros</h1>

            <div class="explore-content-wrapper">
                <!-- Mapa do Brasil -->
                <div class="desktop-map-container">
                    
                    <img src="Img/mapaibge.png" alt="Mapa do Brasil" class="brazil-map-img">
                </div>

                <!-- Grelha de Biomas (3 colunas, 2 linhas) -->
                <div class="desktop-biomes-grid">
                    
                    <!-- Amazônia -->
                    <a href="Amazoniadesktop.html" class="biome-card-desk">
                       
                        <img src="Img/amazoniabiomas.jpeg" alt="Amazônia">
                        <div class="biome-bar-desk biome-amazonia">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Amazônia</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Mata Atlântica -->
                    <a href="mataAtdesktop.html" class="biome-card-desk">
                       
                        <img src="Img/mataatlanticabiomas.jpg" alt="Mata Atlântica">
                        <div class="biome-bar-desk biome-mata">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Mata Atlântica</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Cerrado -->
                    <a href="CerradoDesktop.html" class="biome-card-desk">
                        
                        <img src="img/cerradobiomas.webp" alt="Cerrado">
                        <div class="biome-bar-desk biome-cerrado">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Cerrado</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Caatinga -->
                    <a href="CaatingaDesktop.html" class="biome-card-desk">
                        
                        <img src="Img/caatingabiomas.avif" alt="Caatinga">
                        <div class="biome-bar-desk biome-caatinga">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Caatinga</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Pantanal -->
                    <a href="Pantanal.html" class="biome-card-desk">
                       
                        <img src="Img/pantanalbiomas.webp" alt="Pantanal">
                        <div class="biome-bar-desk biome-pantanal">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Pantanal</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Pampa -->
                    <a href="pampaDesk.html" class="biome-card-desk">
                        
                        <img src="Img/pampabiomas.jpg" alt="Pampa">
                        <div class="biome-bar-desk biome-pampa">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Pampa</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                </div>
            </div>
        </main>

        <!-- Rodapé Desktop -->
        <footer class="desktop-footer">
            
            <img src="Img/logo-superior.png.png" alt="Biomas do Brasil Logo" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
        </footer>

    </div>

</body>
</html>
