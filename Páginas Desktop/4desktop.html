<!<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomas do Brasil - Desktop</title>
    <link rel="stylesheet" href="4.css">
</head>
<body>

    <!-- Checkbox e Overlay para o Menu Lateral (Necessário para a responsividade funcionar) -->
    <input type="checkbox" id="drawer-toggle" class="menu-checkbox">
    <label for="drawer-toggle" class="overlay" aria-label="Fechar menu"></label>

    <!-- Menu Lateral (Drawer) para telas menores -->
    <aside class="drawer">
        <div class="drawer-header">
            <div class="drawer-avatar"><img src="Img/LOGOdentroMenu.png.png" alt="logo biomas" width="80"></div>
            <label for="drawer-toggle" class="drawer-close-btn" aria-label="Fechar menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </label>
        </div>
        <nav class="drawer-nav">
            <a href="4desktop.html" class="nav-link">Início</a>
            <a href="biomadesktop.html" class="nav-link">Biomas</a>
            <a href="ProblemasDesktop.html" class="nav-link">Problemas</a>
            <a href="PreservacaoDesk.html" class="nav-link">Preservação</a>
            <a href="SobreDesk.html" class="nav-link">Sobre</a>
        </nav>
    </aside>

    <div class="desktop-container">
        
        <!-- Cabeçalho Desktop (Com o botão hambúrguer adicionado para acionar o menu lateral) -->
        <header class="desktop-header">

            <label for="drawer-toggle" class="hamburger-btn" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <a href="4desktop.html">
    <img src="Img/logo-superior.png.png" alt="Biomas do Brasil Logo" class="desktop-logo">
</a>
            
            <nav class="desktop-nav">
                <a href="4desktop.html" class="nav-link">Início</a>
                <a href="biomadesktop.html" class="nav-link">Biomas</a>
                <a href="ProblemasDesktop.html" class="nav-link">Problemas</a>
                <a href="PreservacaoDesk.html" class="nav-link">Preservação</a>
                <a href="SobreDesk.html" class="nav-link">Sobre</a>
            </nav>
        </header>

        <main class="hero-desktop">
            <div class="hero-left-content">
                <h1 class="hero-title">BIOMAS</h1>
                <h2 class="hero-subtitle">— DO BRASIL —</h2>
                <p class="hero-description">CONHECER PARA PRESERVAR</p>
            </div>

            <!-- Botões centrais (Agora ambos são links funcionais, limpos e sem tags soltas) -->
            <div class="hero-buttons-desktop">
                <a href="biomadesktop.html" class="desktop-btn btn-green-to-gray">
                    <img src="Img/folhinha.png" alt="Ícone" class="btn-icon"> Explorar Biomas
                </a>
                
                <a href="ProblemasDesktop.html" class="desktop-btn btn-light-gray">
                    <img src="Img/alerta1.png" alt="Ícone" class="btn-icon"> Problemas Ambientais
                </a>
            </div>
        </main>

        <!-- Rodapé Desktop -->
        <footer class="desktop-footer">
           <a href="4desktop.html">
    <img src="Img/logo-superior.png.png" alt="Biomas do Brasil Logo" class="footer-logo">
</a>
            <p class="footer-copyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
        </footer>

    </div>

</body>
</html>
