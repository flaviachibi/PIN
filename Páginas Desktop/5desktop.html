<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore os Biomas - Desktop</title>
    <link rel="stylesheet" href="5.css">
</head>
<body>

    <div class="desktop-container">
        
        <!-- Cabeçalho Desktop -->
        <header class="desktop-header">
            <!-- INSIRA A FOTO DO LOGO AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="desktop-logo">
            
            <nav class="desktop-nav">
                <a href="#" class="nav-link">Início</a>
                <a href="#" class="nav-link active">Biomas</a>
                <a href="#" class="nav-link">Problemas</a>
                <a href="#" class="nav-link">Preservação</a>
                <a href="#" class="nav-link">Sobre</a>
            </nav>
        </header>

        <!-- Seção Principal (Explore os Biomas) -->
        <main class="explore-desktop-section">
            <h1 class="explore-desktop-title">Explore os biomas brasileiros</h1>

            <div class="explore-content-wrapper">
                <!-- Mapa do Brasil -->
                <div class="desktop-map-container">
                    <!-- INSIRA A FOTO DO MAPA DO BRASIL AQUI -->
                    <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=400&auto=format&fit=crop" alt="Mapa do Brasil" class="brazil-map-img">
                </div>

                <!-- Grelha de Biomas (3 colunas, 2 linhas) -->
                <div class="desktop-biomes-grid">
                    
                    <!-- Amazônia -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DA AMAZÔNIA AQUI -->
                        <img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?q=80&w=300&auto=format&fit=crop" alt="Amazônia">
                        <div class="biome-bar-desk biome-amazonia">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Amazônia</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Mata Atlântica -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DA MATA ATLÂNTICA AQUI -->
                        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=300&auto=format&fit=crop" alt="Mata Atlântica">
                        <div class="biome-bar-desk biome-mata">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Mata Atlântica</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Cerrado -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DO CERRADO AQUI -->
                        <img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=300&auto=format&fit=crop" alt="Cerrado">
                        <div class="biome-bar-desk biome-cerrado">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Cerrado</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Caatinga -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DA CAATINGA AQUI -->
                        <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=300&auto=format&fit=crop" alt="Caatinga">
                        <div class="biome-bar-desk biome-caatinga">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Caatinga</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Pantanal -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DO PANTANAL AQUI -->
                        <img src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=300&auto=format&fit=crop" alt="Pantanal">
                        <div class="biome-bar-desk biome-pantanal">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Pantanal</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                    <!-- Pampa -->
                    <a href="#" class="biome-card-desk">
                        <!-- INSIRA A FOTO DO PAMPA AQUI -->
                        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=300&auto=format&fit=crop" alt="Pampa">
                        <div class="biome-bar-desk biome-pampa">
                            <span class="biome-dot"></span>
                            <span class="biome-name">Pampa</span>
                            <span class="biome-arrow">&rarr;</span>
                        </div>
                    </a>

                </div>
            </div>
        </main>

        <!-- Rodapé Desktop -->
        <footer class="desktop-footer">
            <!-- INSIRA A FOTO DO LOGO DO RODAPÉ AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
        </footer>

    </div>

</body>
</html>
