<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazônia - Biomas do Brasil</title>
    <link rel="stylesheet" href="3.css">
</head>
<body>

    <!-- Checkbox invisível para o menu lateral -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <!-- Overlay escuro de fundo -->
    <label for="menu-toggle" class="nav-overlay"></label>

    <!-- Menu Lateral -->
    <nav class="side-nav">
        <div class="side-nav-content">
            <!-- INSIRA A FOTO DO LOGO DO MENU AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="side-nav-logo">
            <hr>
            <a href="#" class="side-nav-item active">
                <span class="icon">&#127806;</span> Preservação
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128683;</span> Problemas
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128240;</span> Notícias
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128213;</span> Quiz's
            </a>
        </div>
        <div class="side-nav-footer">
            <a href="#" class="side-nav-item">
                <span class="icon">&#128172;</span> Sobre Nós
            </a>
        </div>
    </nav>

    <!-- Contentor Principal (Moldura Mobile) -->
    <div class="page-container">
        
        <!-- Cabeçalho -->
        <header class="main-header">
            <label for="menu-toggle" class="menu-btn-toggle" aria-label="Abrir Menu">
                &#9776;
            </label>
            <!-- INSIRA A FOTO DO LOGO DO CABEÇALHO AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="header-logo">
        </header>

        <!-- Banner com Imagem de Fundo e Título -->
        <div class="hero-banner">
            <!-- INSIRA A FOTO DE CAPA DO BIOMA AQUI (ex: floresta amazônica) -->
            <img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?q=80&w=500&auto=format&fit=crop" alt="Amazônia Fundo" class="hero-bg-img">
            <div class="hero-overlay"></div>
            <h1 class="hero-title">Amazônia</h1>
        </div>

        <!-- Conteúdo Principal -->
        <main class="content-section">
            
            <!-- Grelha dos 4 Botões (Fauna, Flora, Clima, Solo) com Hover de Expansão -->
            <div class="options-grid">
                
                <!-- Fauna -->
                <a href="#" class="option-card">
                    <div class="option-circle-img">
                        <!-- INSIRA A FOTO DA FAUNA AQUI -->
                        <img src="https://images.unsplash.com/photo-1543946207-391e47a5a4cf?q=80&w=150&auto=format&fit=crop" alt="Fauna">
                    </div>
                    <span class="option-text">Fauna</span>
                    <span class="option-badge">&#128062;</span>
                </a>

                <!-- Flora -->
                <a href="#" class="option-card">
                    <div class="option-circle-img">
                        <!-- INSIRA A FOTO DA FLORA AQUI -->
                        <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=150&auto=format&fit=crop" alt="Flora">
                    </div>
                    <span class="option-text">Flora</span>
                    <span class="option-badge">&#127793;</span>
                </a>

                <!-- Clima -->
                <a href="#" class="option-card">
                    <div class="option-circle-img">
                        <!-- INSIRA A FOTO DO CLIMA AQUI -->
                        <img src="https://images.unsplash.com/photo-1518549410186-00e5c20b2c0d?q=80&w=150&auto=format&fit=crop" alt="Clima">
                    </div>
                    <span class="option-text">Clima</span>
                    <span class="option-badge">&#9928;</span>
                </a>

                <!-- Solo -->
                <a href="#" class="option-card">
                    <div class="option-circle-img">
                        <!-- INSIRA A FOTO DO SOLO AQUI -->
                        <img src="
