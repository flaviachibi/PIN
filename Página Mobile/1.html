<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomas do Brasil</title>
    <link rel="stylesheet" href="1.css">
</head>

<body>

    <!--menu clicável-->
    <input type="checkbox" id="menu-toggle" class="menu-click">

    <!--para fechar o menu-->
    <label for="menu-toggle" class="fecha-menu"></label>

    <!--menu clicável-->
    <nav class="dentro-menu">
        <div class="dentro-menu-content">

            <!--logo de dentro d menu-->
            <img src="../Página Mobile/Img/LOGOdentroMenu.png" alt="Biomas do Brasil Logo" class="dentro-menu-logo">
            <hr>
            <!--itens de dentro do menu-->
            <a href="#" class="dentro-menu-item active">
                <span class="icon"></span>
                Preservação
            </a>
            <a href="#" class="dentro-menu-item">
                <span class="icon"></span>
                Problemas
            </a>
            <a href="#" class="dentro-menu-item">
                <span class="icon"></span>
                Notícias
            </a>
            <a href="#" class="dentro-menu-item">
                <span class="icon"></span>
                Quiz's
            </a>
        </div>

        <!--rodape fixo de dentro do menu-->
        <div class="dentro-menu-footer">
            <hr>
            <a href="#" class="dentro-menu-item">
                <span class="icon"></span>
                Sobre Nós
            </a>
        </div>
    </nav>

    <!--cabeçalho-->
    <header class="cabecalho">
        <!--label é tipo um botão-->
        <label for="menu-toggle" class="menu-btn-toggle" aria-label="Abrir Menu">
           <span></span>
           <span></span>
           <span></span>
        </label>
        <img src="../Página Mobile/Img/logo-superior.png" alt="Biomas do Brasil Logo" class="cabecalhologo">
    </header>

    <!--página principal-->
    <main class="hero-section">
        <div class="hero-text">
            <h1>BIOMAS</h1>
            <h2>— DO BRASIL —</h2>
            <p>CONHECER PARA PRESERVAR</p>
        </div>
        
        <div class="hero-buttons">
            <button class="hero-btn btn-green">
                <span class="btn-icon">&#127806;</span>
                Explorar Biomas
            </button>
            <button class="hero-btn btn-light">
                <span class="btn-icon alert-icon">&#9888;</span>
                Problemas Ambientais
            </button>
        </div>
    </main>

    <!--rodapé-->
    <footer class="rodapefixo">
        <img src="../Página Mobile/Img/logo-superior.png" alt="Biomas do Brasil Logo" class="rodapelogo">
        <p class="rodapecopyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
    </footer>

</body>
</html>
