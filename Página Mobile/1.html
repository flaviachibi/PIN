<!DOCTYPE html>

<body>

    <!--INICIO DO MENU CLICAVEL-->

    <!-- Input Checkbox Oculto (Técnica do Checkbox Hack) isso serve para abrir o menu-->
    <input type="checkbox" id="drawer-toggle">

<!--inicio  -->
    <!-- Header Fixo -->
    <header>
        <div class="header-left">
            <!-- Label que funciona como Botão Hambúrguer -->
            <label for="drawer-toggle" class="hamburger-btn" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <!--substituir isso pela logo-->
            <a href="#" class="logo">teste</a>
        </div>
       
    </header>



    <!-- Overlay Translúcido -->
    <label for="drawer-toggle" class="overlay" aria-label="Fechar menu"></label>

    <!-- Sidebar Drawer (Puxando da Esquerda) isso serve pro menu vir da direita-->
    <aside class="drawer">
        <div class="drawer-header">
            <div class="drawer-title-area">

                <!--insira aqui o logo que fica dentro do menu  -->
                <div class="drawer-avatar">teSte</div>
                <span style="font-weight: 600; font-size: 0.95rem;"></span>
            </div>
            <!-- Botão de Fechar dentro do Drawer, o X que fecha -->
            <label for="drawer-toggle" class="drawer-close-btn" aria-label="Fechar menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </label>
        </div>
<!--fim-menu-->
