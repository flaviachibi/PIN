<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomas do Brasil</title>
    <link rel="stylesheet" href="1.css">
</head>
<body>

    <!-- Checkbox invisível que controla o estado do menu (aberto/fechado) -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <!-- Overlay de fundo para fechar o menu ao clicar fora -->
    <label for="menu-toggle" class="nav-overlay"></label>

    <!-- Menu Lateral (Slide-in) -->
    <nav class="side-nav">
        <div class="side-nav-content">
            <!-- Logo dentro do menu -->
            <img src="..\IMGS\LOGOdentroMenu.png" alt="Biomas do Brasil Logo" class="side-nav-logo">
            <hr>
            <!-- Itens do menu -->
            <a href="#" class="side-nav-item active">
                <span class="icon">&#127806;</span>
                Preservação
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128683;</span>
                Problemas
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128240;</span>
                Notícias
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128213;</span>
                Quiz's
            </a>
        </div>
        <!-- Item inferior (Sobre Nós) -->
        <div class="side-nav-footer">
            <a href="#" class="side-nav-item">
                <span class="icon">&#128172;</span>
                Sobre Nós
            </a>
        </div>
    </nav>

    <!-- Cabeçalho Principal -->
    <header class="main-header">
        <!-- O label funciona como botão e interage com o checkbox invisível -->
        <label for="menu-toggle" class="menu-btn-toggle" aria-label="Abrir Menu">
            &#9776;
        </label>
        <img src="logo.png" alt="Biomas do Brasil Logo" class="header-logo">
    </header>

    <!-- Conteúdo Principal -->
    <main class="hero-section">
        <div class="hero-text">
            <h1>BIOMAS</h1>
            <h2>— DO BRASIL —</h2>
            <p>CONHECER PARA PRESERVAR</p>
        </div>
        
        <div class="hero-buttons">
            <button class="hero-btn btn-green">
                <span class="btn-icon">&#127806;</span>
                Explorar Biomas
            </button>
            <button class="hero-btn btn-light">
                <span class="btn-icon alert-icon">&#9888;</span>
                Problemas Ambientais
            </button>
        </div>
    </main>

    <!-- Rodapé -->
    <footer class="main-footer">
        <img src="logo.png" alt="Biomas do Brasil Logo" class="footer-logo">
        <p class="footer-copyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
    </footer>

</body>
</html>
