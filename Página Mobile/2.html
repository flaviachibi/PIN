<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Biomas - Biomas do Brasil</title>
    <link rel="stylesheet" href="2.css">
</head>
<body>

    <!-- Checkbox invisível que controla o menu -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox">

    <!-- Overlay escuro de fundo -->
    <label for="menu-toggle" class="nav-overlay"></label>

    <!-- Menu Lateral -->
    <nav class="side-nav">
        <div class="side-nav-content">
            <!-- INSIRA A FOTO DO LOGO AQUI: ex: src="logo.png" -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="side-nav-logo">
            <hr>
            <a href="#" class="side-nav-item active">
                <span class="icon">&#127806;</span> Preservação
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128683;</span> Problemas
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128240;</span> Notícias
            </a>
            <a href="#" class="side-nav-item">
                <span class="icon">&#128213;</span> Quiz's
            </a>
        </div>
        <div class="side-nav-footer">
            <a href="#" class="side-nav-item">
                <span class="icon">&#128172;</span> Sobre Nós
            </a>
        </div>
    </nav>

    <!-- Contentor principal (Moldura Mobile) -->
    <div class="page-container">
        <!-- Cabeçalho -->
        <header class="main-header">
            <label for="menu-toggle" class="menu-btn-toggle" aria-label="Abrir Menu">
                &#9776;
            </label>
            <!-- INSIRA A FOTO DO LOGO DO CABEÇALHO AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="header-logo">
        </header>

        <!-- Conteúdo Principal: Explorar Biomas -->
        <main class="explore-section">
            <h1 class="explore-title">Explore os biomas brasileiros</h1>

            <!-- Mapa do Brasil -->
            <div class="map-container">
                <!-- INSIRA A FOTO DO MAPA DO BRASIL AQUI: ex: src="mapa-brasil.png" -->
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?q=80&w=400&auto=format&fit=crop" alt="Mapa do Brasil com Biomas" class="brazil-map">
            </div>

            <!-- Grelha de Biomas -->
            <div class="biomes-grid">
                
                <!-- 1. Amazônia -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DA AMAZÓNIA AQUI -->
                    <img src="https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?q=80&w=300&auto=format&fit=crop" alt="Amazônia">
                    <div class="biome-bar biome-amazonia">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Amazônia</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

                <!-- 2. Caatinga -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DA CAATINGA AQUI -->
                    <img src="https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=300&auto=format&fit=crop" alt="Caatinga">
                    <div class="biome-bar biome-caatinga">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Caatinga</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

                <!-- 3. Pampa -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DO PAMPA AQUI -->
                    <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=300&auto=format&fit=crop" alt="Pampa">
                    <div class="biome-bar biome-pampa">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Pampa</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

                <!-- 4. Cerrado -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DO CERRADO AQUI -->
                    <img src="https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=300&auto=format&fit=crop" alt="Cerrado">
                    <div class="biome-bar biome-cerrado">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Cerrado</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

                <!-- 5. Pantanal -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DO PANTANAL AQUI -->
                    <img src="https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=300&auto=format&fit=crop" alt="Pantanal">
                    <div class="biome-bar biome-pantanal">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Pantanal</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

                <!-- 6. Mata Atlântica -->
                <a href="#" class="biome-card">
                    <!-- INSIRA A FOTO DA MATA ATLÂNTICA AQUI -->
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=300&auto=format&fit=crop" alt="Mata Atlântica">
                    <div class="biome-bar biome-mata">
                        <span class="biome-dot"></span>
                        <span class="biome-name">Mata Atlântica</span>
                        <span class="biome-arrow">&rarr;</span>
                    </div>
                </a>

            </div>
        </main>

        <!-- Rodapé -->
        <footer class="main-footer">
            <!-- INSIRA A FOTO DO LOGO DO RODAPÉ AQUI -->
            <img src="logo.png" alt="Biomas do Brasil Logo" class="footer-logo">
            <p class="footer-copyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
        </footer>
    </div>

</body>
</html>
