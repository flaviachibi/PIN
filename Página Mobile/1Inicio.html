<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biomas do Brasil</title>
    <link rel="stylesheet" href="1Inicio.css">
</head>

<body>

    <!--INICIO DO MENU CLICAVEL-->

    <!-- Input Checkbox Oculto (Técnica do Checkbox Hack) isso serve para abrir o menu-->
    <input type="checkbox" id="drawer-toggle">

<!--inicio  -->
    <!-- Header Fixo -->
    <header>
        <section class="header-left">
            <!-- Label que funciona como Botão Hambúrguer -->
            <label for="drawer-toggle" class="hamburger-btn" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <!--logo-->
            <a href="#" class="logo"><img src="Img/logo-superior.png" alt="logo biomas" width="150"></a>
        </section>
       
    </header>



    <!-- Overlay Translúcido -->
    <label for="drawer-toggle" class="overlay" aria-label="Fechar menu"></label>

    
    <!-- Sidebar Drawer (Puxando da Esquerda) isso serve pro menu vir da direita-->
    <aside class="drawer">
        <div class="drawer-header">
            <div class="drawer-title-area">

                <!--insira aqui o logo que fica dentro do menu  -->
                <div class="drawer-avatar"><img src="Img/LOGOdentroMenu.png" alt="logo biomas" width="80"></div>
                
            </div>
            <!-- Botão de Fechar dentro do Drawer, o X que fecha -->
            <label for="drawer-toggle" class="drawer-close-btn" aria-label="Fechar menu">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </label>
        </div>


<!--aqui fica as opções do menu como "preservação, problemas, noticias......   "-->
        <nav class="drawer-nav">
            <a href="1Inicio.html" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                Início
            </a>
            <a href="#" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                Preservação
            </a>
            <a href="#" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                Problemas
            </a>
            <a href="#" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                Noticias
            </a>
            <a href="#" class="nav-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"></svg>
                Quiz
            </a>
        </nav>

        <!--aqui fica o rodape fixo de dentro do menu-->
        <footer class="drawer-footer">
            <section>
                <article>
                    <h4>Sobre Nós</h4>
                </article>
            </section>
        </footer>
    </aside>
<!--FIM DO MENU LATERAL-->

  


    <!--página principal-->
    <main class="hero-section">
        <section class="hero-text">
            <h1>BIOMAS</h1>
            <h2>— DO BRASIL —</h2>
            <p>CONHECER PARA PRESERVAR</p>
        </section>
        
        <section class="hero-buttons">
            <a href="2PagBiomas.html">
            <button class="hero-btn btn-verde">
                <span class="btn-icon"><img src="Img/folhinha.png" alt="logo biomas" width="25"></span>
                Explorar Biomas
            </button>
            </a>
            <button class="hero-btn btn-branco">
                <span class="btn-icon alert-icon"><img src="Img/alerta1.png" alt="logo biomas" width="30"></span>
                Problemas Ambientais
            </button>
        </section>
    </main>




    <!--rodapé fixo da página-->
    <footer class="rodapefixo">
        <img src="../Página Mobile/Img/logo-superior.png" alt="Biomas do Brasil Logo" class="rodapelogo">
        <p class="rodapecopyright">&copy; 2026 Biomas do Brasil<br>Todos os direitos reservados</p>
    </footer>

</body>
</html>
